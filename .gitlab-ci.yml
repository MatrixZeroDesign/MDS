workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH || $CI_COMMIT_TAG"

stages:
  - verify
  - publish

default:
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

verify:
  stage: verify
  script:
    - npm run check
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - packages/ui/dist/
      - packages/icons/dist/
      - packages/charts/dist/
      - apps/docs/dist/
      - test-results/
    reports:
      junit: test-results/results.xml

publish-preview:
  stage: publish
  needs:
    - job: verify
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - MDS_PACKAGE: [icons, ui, charts]
  script:
    - node scripts/publish.mjs --preview --package "$MDS_PACKAGE"

publish-tag:
  stage: publish
  needs:
    - job: verify
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(icons|ui|charts)-v[0-9]+\.[0-9]+\.[0-9]+/'
      when: manual
  script:
    - node scripts/publish.mjs

docs-portal:
  stage: publish
  needs:
    - job: verify
      artifacts: true
  before_script: []
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  script:
    - test -s apps/docs/dist/index.html
  pages:
    publish: apps/docs/dist
  environment:
    name: docs
    url: https://mds-b1761b.gitlab.io
