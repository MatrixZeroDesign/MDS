name: Publish packages

on:
  push:
    tags:
      - "icons-v*.*.*"
      - "ui-v*.*.*"
      - "charts-v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # The tagged commit must already be part of main, where the full browser suite runs.
      # Release keeps package-specific build, type, install/SSR and tree-shaking gates.
      - run: npm run check:release
      - name: Publish tagged package
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
